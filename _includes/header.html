{% include calculate_relative_base.html %}
{% include escape-404.html %}

<header class="main-header{% if page.layout == "post" %} post-header{% endif %}">
  <div class="top-banner">
    {% capture logo_url %}{{ relativebase }}{{ site.logo  }}{% endcapture %}
    {% assign logo_url = logo_url | replace: "//", "/" %}
    <div class="logo"><a href="{{ relativebase }}"><img class="logo" id="logo" src="{{ logo_url }}" alt="{{ site.title }}"></a></div>
  </div>
  <div class="wrapper">
    <div class="header-flex">
      <div class="menu-icon-container">
        <span class="menu-icon"><i class="fa fa-bars" aria-hidden="true"></i></span>
      </div>
      <nav class="main-nav">
        <span class="menu-icon-close"><i class="fa fa-times" aria-hidden="true"></i></span>
        <ul>
          <li>
            {% include theme-toggle.html %}
          </li>
          <li>
            <a href="{{ relativebase }}">
              <div class="left">
                首页
              </div>  
              <div class="right">
                <svg width="24px" aria-hidden="true" focusable="false" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.2 16.8l4.6-4.4 3.1 3.1 3.3-4.1 4.6 5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="9.3" r="1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </div>
            </a>
          </li>

            <a href="{{ relativebase }}about.html">

                关于
              </div>

      </nav>
      <div class="search-icon-container">
        <span class="search-icon"><a><i class="fa fa-search" aria-hidden="true"></i></a></span>
      </div>
    </div>
  </div>
</header> <!-- End Header -->
