{% include calculate_relative_base.html %}
{% include escape-404.html %}

<header class="main-header{% if page.layout == "post" %} post-header{% endif %}">
  <div class="top-banner">
    {% capture logo_url %}{{ relativebase }}{{ site.logo  }}{% endcapture %}
    {% assign logo_url = logo_url | replace: "//", "/" %}
    <div class="logo"><a href="{{ relativebase }}"><img class="logo" id="logo" src="{{ logo_url }}" alt="{{ site.title }}"></a></div>
  </div>
  <div class="wrapper">
    <div class="header-flex">
      <div class="menu-icon-container">
        <span class="menu-icon"><i class="fa fa-bars" aria-hidden="true"></i></span>
      </div>
      <nav class="main-nav">
        <span class="menu-icon-close"><i class="fa fa-times" aria-hidden="true"></i></span>
        <ul>
          <li>
            {% include theme-toggle.html %}
          </li>
          <li>
            <a href="{{ relativebase }}">
              <div class="left">
                首页
              </div>  
              <div class="right">
                <svg width="24px" aria-hidden="true" focusable="false" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3.5 11 L12 3.5 L20.5 11" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M5 10.6 V20.5 H19 V10.6" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M9.5 20.5 V14.5 H14.5 V20.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg>
              </div>
            </a>
          </li>
          <li>
            <a href="{{ relativebase }}archive.html">
              <div class="left">
                文章
              </div>
              <div class="right">
                <svg width="24px" aria-hidden="true" focusable="false" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M12 6.2 V12.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M12 12.5 L15.8 14.6" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg>
              </div>
            </a>
          </li>
          <li>
            <a href="{{ relativebase }}album.html">
              <div class="left">
                相册
              </div>
              <div class="right">
                <svg width="24px" aria-hidden="true" focusable="false" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M4.5 17.5 L9 13 L11.8 15.8 L14.8 12 L19.5 17.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="8" cy="9.5" r="1.2" fill="currentColor"/></svg>
              </div>
            </a>
          </li>
          <li>
            <a href="{{ relativebase }}about.html">
              <div class="left">
                关于
              </div>
              <div class="right">
                <svg width="24px" aria-hidden="true" focusable="false" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="7.2" r="3.4" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M4.5 20.5 c0-4.3 3.4-7.6 7.5-7.6 s7.5 3.3 7.5 7.6" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg>
              </div>
            </a>
          </li>
        </ul>
      </nav>
      <div class="search-icon-container">
        <span class="search-icon"><a><i class="fa fa-search" aria-hidden="true"></i></a></span>
      </div>
    </div>
  </div>
</header> <!-- End Header -->
