title: 温柔样本
permalink: album:output_ext
---
{% include calculate_relative_base.html %}

<style>
.album-wrap {
  max-width: 1080px;
  margin: 0 auto 60px;
}
.album-title {
  text-align: center;
  margin: 10px 0 30px;
}
.album-slider {
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  background: #0b1622;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .22);
}
.album-track {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  max-height: 78vh;
  margin: 0;
}
.album-slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  transition: opacity .8s ease;
  pointer-events: none;
}
.album-slide.is-active {
  opacity: 1;
  pointer-events: auto;
}
.album-slide img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #0b1622;
}
.album-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .82);
  color: #22303d;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .25s ease, background .25s ease;
}
.album-slider:hover .album-arrow,
.album-arrow:focus {
  opacity: 1;
}
.album-arrow:hover {
  background: #fff;
}
.album-arrow.prev { left: 16px; }
.album-arrow.next { right: 16px; }
.album-dots {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 16px;
  display: flex;
  justify-content: center;
  gap: 10px;
}
.album-dots button {
  width: 9px;
  height: 9px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .45);
  cursor: pointer;
  transition: background .25s ease, transform .25s ease;
}
.album-dots button.is-active {
  background: #fff;
  transform: scale(1.25);
}
@media (max-width: 767px) {
  .album-track { aspect-ratio: 3 / 4; max-height: 70vh; }
  .album-arrow { opacity: 1; width: 38px; height: 38px; }
  .album-arrow.prev { left: 10px; }
  .album-arrow.next { right: 10px; }
}
</style>

<div class="album-wrap">
  <h1 class="album-title">温柔样本</h1>
  <div class="album-slider" id="album-slider">
    <div class="album-track">
      <figure class="album-slide is-active">
        <img src="{{ relativebase }}assets/img/album/album-1.jpg" alt="相册照片 1">
      </figure>
      <figure class="album-slide">
        <img src="{{ relativebase }}assets/img/album/album-2.jpg" alt="相册照片 2">
      </figure>
      <figure class="album-slide">
        <img src="{{ relativebase }}assets/img/album/album-3.jpg" alt="相册照片 3">
      </figure>
    </div>
    <button class="album-arrow prev" type="button" aria-label="上一张">&#10094;</button>
    <button class="album-arrow next" type="button" aria-label="下一张">&#10095;</button>
    <div class="album-dots" id="album-dots">
      <button type="button" class="is-active" aria-label="第 1 张"></button>
      <button type="button" aria-label="第 2 张"></button>
      <button type="button" aria-label="第 3 张"></button>
    </div>
  </div>
</div>

<script>
(function () {
  var slider = document.getElementById('album-slider');
  if (!slider) return;
  var slides = slider.querySelectorAll('.album-slide');
  var dots = slider.querySelectorAll('#album-dots button');
  var index = 0;
  var timer = null;
  var delay = 5000;

  function show(i) {
    index = (i + slides.length) % slides.length;
    for (var k = 0; k < slides.length; k++) {
      slides[k].classList.toggle('is-active', k === index);
      if (dots[k]) dots[k].classList.toggle('is-active', k === index);
    }
  }
  function next() { show(index + 1); }
  function prev() { show(index - 1); }
  function play() {
    stop();
    timer = setInterval(next, delay);
  }
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  slider.querySelector('.album-arrow.next').addEventListener('click', function () { next(); play(); });
  slider.querySelector('.album-arrow.prev').addEventListener('click', function () { prev(); play(); });
  for (var i = 0; i < dots.length; i++) {
    (function (n) {
      dots[n].addEventListener('click', function () { show(n); play(); });
    })(i);
  }
  slider.addEventListener('mouseenter', stop);
  slider.addEventListener('mouseleave', play);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { prev(); play(); }
    if (e.key === 'ArrowRight') { next(); play(); }
  });
  if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    play();
  }
})();
</script>
